name: link-check

# Reference rot is not a merge blocker: this workflow is not a required check, so
# it never gates a PR. It runs on a schedule and reports — a red run is the
# notification that a cited URL died.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Probe every cited reference
        run: python3 scripts/check_links.py
