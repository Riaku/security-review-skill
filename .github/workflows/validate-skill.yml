name: validate-skill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to full commit SHAs, per
      # issues/ci-action-pinning.md — a retagged tag can swap in arbitrary code
      # that runs with this workflow's token. Comments carry the human-readable
      # version; bump both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # check_generated.py runs the generator itself, and the generator is the
      # format gate. Generating before it would overwrite the very drift it is
      # looking for, so this is the only generation step in CI.
      - name: Bundles in sync with the generator (and format gate)
        run: python3 scripts/check_generated.py

      - name: Size budgets (SKILL.md < 500 lines, issues <= 1500 words)
        run: |
          set -e
          lines=$(wc -l < SKILL.md)
          if [ "$lines" -ge 500 ]; then
            echo "SKILL.md is $lines lines (spec budget: <500) — move detail to references/"
            exit 1
          fi
          echo "SKILL.md: $lines lines OK"
          big=""
          for f in issues/*.md; do
            w=$(wc -w < "$f")
            if [ "$w" -gt 1500 ]; then big="$big$f ($w words)"$'\n'; fi
          done
          if [ -n "$big" ]; then
            echo "Oversized issue files:"; printf '%s' "$big"; exit 1
          fi
          echo "all issue files within budget"
